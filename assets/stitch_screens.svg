<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#070a13; font-family:'Inter', sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3b5c"/>
      <stop offset="100%" stop-color="#c2185b"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#4a00e0"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Banner / Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#0c101d" stroke="#1f293d" stroke-width="1"/>
  <circle cx="40" cy="35" r="7" fill="#ff3b5c" filter="url(#glowCyan)"/>
  <text x="60" y="41" fill="#ffffff" font-size="20" font-weight="800" letter-spacing="1">SE PRIMER · GOOGLE STITCH MOBİL EKRAN TASARIMLARI</text>
  <text x="1000" y="41" fill="#00d2ff" font-size="13" font-weight="700">YZM301 · DESIGN.MD</text>

  <!-- ==================== EKRAN 1: ONBOARDING ==================== -->
  <g transform="translate(40, 100)">
    <!-- Phone Mockup Frame -->
    <rect x="0" y="0" width="340" height="660" rx="32" fill="url(#bgGrad)" stroke="#222f46" stroke-width="3"/>
    <!-- Speaker / Notch -->
    <rect x="120" y="10" width="100" height="14" rx="7" fill="#151d2e"/>
    
    <!-- Header -->
    <text x="24" y="55" fill="#00d2ff" font-size="11" font-weight="800" letter-spacing="1">YZM301 · 1. HAFTA</text>
    <text x="24" y="85" fill="#ffffff" font-size="16" font-weight="800">08:00, Randevu Sistemi</text>
    <text x="24" y="105" fill="#ff3b5c" font-size="16" font-weight="800">Çöktü. Nöbetçi Sensin.</text>

    <!-- Question 1: Seviye -->
    <rect x="20" y="130" width="300" height="110" rx="12" fill="#121829" stroke="#00d2ff" stroke-width="1.5"/>
    <text x="34" y="152" fill="#00d2ff" font-size="11" font-weight="700">1. DENEYİM SEVİYEN NEDİR?</text>
    
    <rect x="30" y="165" width="280" height="32" rx="8" fill="#1a233a" stroke="#00d2ff" stroke-width="1"/>
    <text x="44" y="185" fill="#ffffff" font-size="12" font-weight="700">🌱 Yeni Başladım (İpucu Destekli)</text>
    
    <rect x="30" y="202" width="280" height="32" rx="8" fill="#0e1424" stroke="#222f46" stroke-width="1"/>
    <text x="44" y="222" fill="#64748b" font-size="12" font-weight="600">🔥 Deneyimliyim (60 sn Süre Baskısı)</text>

    <!-- Question 2: Rol -->
    <rect x="20" y="255" width="300" height="100" rx="12" fill="#121829" stroke="#1f293d" stroke-width="1"/>
    <text x="34" y="278" fill="#94a3b8" font-size="11" font-weight="700">2. UZMANLIK ROLÜN NEDİR?</text>
    
    <rect x="30" y="292" width="130" height="28" rx="14" fill="#8a2be2" fill-opacity="0.25" stroke="#8a2be2" stroke-width="1"/>
    <text x="46" y="310" fill="#ffffff" font-size="11" font-weight="700">⚙️ Backend</text>

    <rect x="170" y="292" width="135" height="28" rx="14" fill="#151c2f"/>
    <text x="186" y="310" fill="#64748b" font-size="11" font-weight="600">☁️ DevOps/SRE</text>

    <rect x="30" y="325" width="130" height="25" rx="12" fill="#151c2f"/>
    <text x="46" y="341" fill="#64748b" font-size="10" font-weight="600">🎨 Frontend</text>

    <rect x="170" y="325" width="135" height="25" rx="12" fill="#151c2f"/>
    <text x="186" y="341" fill="#64748b" font-size="10" font-weight="600">🧩 Fullstack</text>

    <!-- Question 3: Hedef -->
    <rect x="20" y="370" width="300" height="90" rx="12" fill="#121829" stroke="#1f293d" stroke-width="1"/>
    <text x="34" y="393" fill="#94a3b8" font-size="11" font-weight="700">3. KRİZDEKİ HEDEFİN?</text>
    <rect x="30" y="405" width="280" height="26" rx="8" fill="#1a233a" stroke="#8a2be2" stroke-width="1"/>
    <text x="40" y="422" fill="#ffffff" font-size="11" font-weight="600">⏱️ Hızlı Çözüm &amp; Kesintisiz Uptime</text>
    <rect x="30" y="435" width="280" height="20" rx="6" fill="#151c2f"/>
    <text x="40" y="448" fill="#64748b" font-size="9" font-weight="600">🛡️ Veri Güvenliği &amp; KVKK</text>

    <!-- Start Button -->
    <rect x="20" y="550" width="300" height="52" rx="14" fill="url(#redGrad)" filter="url(#glowCyan)"/>
    <text x="75" y="582" fill="#ffffff" font-size="15" font-weight="800">🚨 KRİZE MÜDAHALE ET</text>

    <text x="95" y="640" fill="#94a3b8" font-size="12" font-weight="700">EKRAN 1: ONBOARDING</text>
  </g>

  <!-- ==================== EKRAN 2: KRİZ SAHNESİ ==================== -->
  <g transform="translate(430, 100)">
    <rect x="0" y="0" width="340" height="660" rx="32" fill="url(#bgGrad)" stroke="#00d2ff" stroke-width="2"/>
    <rect x="120" y="10" width="100" height="14" rx="7" fill="#151d2e"/>

    <!-- HUD -->
    <rect x="20" y="40" width="90" height="42" rx="8" fill="#121829" stroke="#1f293d"/>
    <text x="45" y="56" fill="#64748b" font-size="9" font-weight="700">SÜRE</text>
    <text x="38" y="73" fill="#ff3b5c" font-size="13" font-weight="800">00:48</text>

    <rect x="120" y="40" width="100" height="42" rx="8" fill="#121829" stroke="#1f293d"/>
    <text x="135" y="56" fill="#64748b" font-size="9" font-weight="700">HASTA</text>
    <text x="145" y="73" fill="#ffb300" font-size="13" font-weight="800">300</text>

    <rect x="230" y="40" width="90" height="42" rx="8" fill="#121829" stroke="#1f293d"/>
    <text x="250" y="56" fill="#64748b" font-size="9" font-weight="700">AŞAMA</text>
    <text x="257" y="73" fill="#00d2ff" font-size="13" font-weight="800">1 / 3</text>

    <!-- Terminal -->
    <rect x="20" y="95" width="300" height="80" rx="10" fill="#050810" stroke="#1f293d"/>
    <circle cx="34" cy="107" r="4" fill="#ff5f56"/>
    <circle cx="46" cy="107" r="4" fill="#ffbd2e"/>
    <circle cx="58" cy="107" r="4" fill="#27c93f"/>
    <text x="70" y="111" fill="#475569" font-size="9" font-family="'JetBrains Mono', monospace">hospital-api · live</text>
    <text x="28" y="132" fill="#f87171" font-size="9" font-family="'JetBrains Mono', monospace">08:00:03 [SQL] Connection pool dead</text>
    <text x="28" y="148" fill="#fbbf24" font-size="9" font-family="'JetBrains Mono', monospace">08:00:07 [API] POST /randevu 500 NullPtr</text>
    <text x="28" y="164" fill="#34d399" font-size="9" font-family="'JetBrains Mono', monospace">08:00:12 [Prometheus] CPU throttle 98%</text>

    <!-- Karar Kartı -->
    <rect x="20" y="188" width="300" height="195" rx="12" fill="#121829" stroke="#1f293d"/>
    <rect x="30" y="198" width="115" height="18" rx="4" fill="#00d2ff" fill-opacity="0.15"/>
    <text x="35" y="211" fill="#00d2ff" font-size="9" font-weight="800">KARAR 1 · MİMARİ</text>
    <text x="30" y="234" fill="#ffffff" font-size="12" font-weight="700">Randevu sistemi çöktü. Ne yapacaksın?</text>

    <!-- Option A -->
    <rect x="30" y="250" width="280" height="52" rx="8" fill="#162035" stroke="#00d2ff" stroke-width="1.5"/>
    <circle cx="50" cy="276" r="12" fill="#00d2ff" fill-opacity="0.2"/>
    <text x="46" y="281" fill="#00d2ff" font-size="12" font-weight="800">A</text>
    <text x="72" y="271" fill="#ffffff" font-size="11" font-weight="700">Eski sürüme geri dön (Rollback)</text>
    <text x="72" y="287" fill="#94a3b8" font-size="9">v2.3.9 kararlı sürümüne dön</text>

    <!-- Option B -->
    <rect x="30" y="312" width="280" height="52" rx="8" fill="#0e1424" stroke="#1f293d"/>
    <circle cx="50" cy="338" r="12" fill="#1f293d"/>
    <text x="46" y="343" fill="#64748b" font-size="12" font-weight="800">B</text>
    <text x="72" y="333" fill="#cbd5e1" font-size="11" font-weight="700">Canlıda yama yap (Hotfix)</text>
    <text x="72" y="349" fill="#64748b" font-size="9">Canlı container üzerinde düzelt</text>

    <!-- Sokratik AI Tutor Kartı -->
    <rect x="20" y="395" width="300" height="150" rx="14" fill="#16122a" stroke="#8a2be2" stroke-width="1.5"/>
    <text x="34" y="418" fill="#ffffff" font-size="12" font-weight="800">🤖 Sokratik AI Tutor</text>
    <text x="34" y="432" fill="#a78bfa" font-size="9">Cevabı söylemez, teknik soru sorar:</text>
    
    <rect x="30" y="442" width="280" height="52" rx="6" fill="#221845"/>
    <text x="38" y="460" fill="#e9d5ff" font-size="10" font-style="italic">“Geri dönmeden önce veritabanı</text>
    <text x="38" y="475" fill="#e9d5ff" font-size="10" font-style="italic">şemasının değiştiğini nasıl anlarsın?”</text>

    <rect x="30" y="504" width="215" height="28" rx="6" fill="#0d0a1b" stroke="#8a2be2" stroke-width="0.8"/>
    <text x="40" y="522" fill="#64748b" font-size="10">Tutor'a soru sor...</text>
    <rect x="255" y="504" width="55" height="28" rx="6" fill="#8a2be2"/>
    <text x="278" y="522" fill="#ffffff" font-size="12">➤</text>

    <!-- Feedback Bar -->
    <rect x="20" y="560" width="300" height="50" rx="8" fill="#00e676" fill-opacity="0.1" stroke="#00e676" stroke-width="1"/>
    <text x="30" y="578" fill="#00e676" font-size="10" font-weight="800">⚙️ TEKNİK SONUÇ: NE OLDU, NEDEN OLDU?</text>
    <text x="30" y="596" fill="#cbd5e1" font-size="9">Rollback yapıldı: v2.3.9 devrede, DB migration riski incelendi.</text>

    <text x="110" y="640" fill="#00d2ff" font-size="12" font-weight="700">EKRAN 2: KRİZ SAHNESİ</text>
  </g>

  <!-- ==================== EKRAN 3: POST-MORTEM SONUÇ ==================== -->
  <g transform="translate(820, 100)">
    <rect x="0" y="0" width="340" height="660" rx="32" fill="url(#bgGrad)" stroke="#00e676" stroke-width="2"/>
    <rect x="120" y="10" width="100" height="14" rx="7" fill="#151d2e"/>

    <!-- Shield Icon & Tag -->
    <circle cx="170" cy="80" r="32" fill="#00e676" fill-opacity="0.2" stroke="#00e676" stroke-width="2"/>
    <text x="156" y="88" fill="#00e676" font-size="28">🛡️</text>
    <text x="90" y="130" fill="#00e676" font-size="10" font-weight="800" letter-spacing="1">POST-MORTEM: İYİ SON</text>
    <text x="45" y="152" fill="#ffffff" font-size="14" font-weight="800">08:25 · Sistem Ayakta, Veri Güvende</text>

    <!-- Metrics -->
    <rect x="20" y="170" width="145" height="55" rx="8" fill="#121829" stroke="#1f293d"/>
    <text x="30" y="188" fill="#64748b" font-size="9" font-weight="700">ÇÖZÜM SAATİ</text>
    <text x="30" y="210" fill="#ffffff" font-size="14" font-weight="800">08:25</text>

    <rect x="175" y="170" width="145" height="55" rx="8" fill="#121829" stroke="#1f293d"/>
    <text x="185" y="188" fill="#64748b" font-size="9" font-weight="700">VERİ BÜTÜNLÜĞÜ</text>
    <text x="185" y="210" fill="#00e676" font-size="13" font-weight="800">Korundu (%100)</text>

    <rect x="20" y="235" width="145" height="55" rx="8" fill="#121829" stroke="#1f293d"/>
    <text x="30" y="253" fill="#64748b" font-size="9" font-weight="700">KVKK UYUM</text>
    <text x="30" y="275" fill="#00e676" font-size="13" font-weight="800">0 İhlal (Tam Uyum)</text>

    <rect x="175" y="235" width="145" height="55" rx="8" fill="#121829" stroke="#1f293d"/>
    <text x="185" y="253" fill="#64748b" font-size="9" font-weight="700">SOKRATİK PUAN</text>
    <text x="185" y="275" fill="#00d2ff" font-size="14" font-weight="800">95 / 100</text>

    <!-- Post-Mortem Timeline -->
    <rect x="20" y="305" width="300" height="170" rx="10" fill="#121829" stroke="#1f293d"/>
    <text x="34" y="328" fill="#ffffff" font-size="11" font-weight="700">📋 Karar ve Sonuç Günlüğü</text>
    
    <text x="34" y="352" fill="#00d2ff" font-size="9" font-weight="700">1. Mimari: Rollback</text>
    <text x="34" y="366" fill="#94a3b8" font-size="9">Eski sürüme dönüldü, veritabanı kilitlenmedi.</text>

    <text x="34" y="390" fill="#00d2ff" font-size="9" font-weight="700">2. Test: Kısa Duman Testi</text>
    <text x="34" y="404" fill="#94a3b8" font-size="9">+3 dk gecikmeyle 0 hata garantisi alındı.</text>

    <text x="34" y="428" fill="#00e676" font-size="9" font-weight="700">3. KVKK: Hasta Adı Maskelendi</text>
    <text x="34" y="442" fill="#94a3b8" font-size="9">PII regex filtreleme ile veriler güvende kaldı.</text>

    <!-- AI Tutor Closing -->
    <rect x="20" y="490" width="300" height="60" rx="8" fill="#1a1435" stroke="#8a2be2" stroke-width="1"/>
    <text x="30" y="510" fill="#ffffff" font-size="10" font-weight="700">🤖 AI Tutor Değerlendirmesi:</text>
    <text x="30" y="528" fill="#e9d5ff" font-size="9" font-style="italic">"Baskı altındayken bile veri güvenliğini feda etmedin!</text>
    <text x="30" y="542" fill="#e9d5ff" font-size="9" font-style="italic">Harika bir mühendislik disiplini sergiledin."</text>

    <!-- Restart Button -->
    <rect x="20" y="565" width="300" height="46" rx="12" fill="#1a233a" stroke="#00d2ff" stroke-width="1"/>
    <text x="75" y="593" fill="#00d2ff" font-size="13" font-weight="700">🔄 YENİDEN OYNA (Farklı Yol Dene)</text>

    <text x="100" y="640" fill="#00e676" font-size="12" font-weight="700">EKRAN 3: POST-MORTEM</text>
  </g>
</svg>
